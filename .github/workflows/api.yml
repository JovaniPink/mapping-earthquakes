name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify the declared toolchain
        run: |
          node --version
          corepack npm --version
      - run: corepack npm ci
      - run: corepack npm install-scripts ls
      - run: corepack npm test
      - run: corepack npm exec -- playwright install --with-deps chromium
      - run: corepack npm run test:browser
      - run: corepack npm audit --audit-level=low
